version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: camerohealth/api:1.0.0
    container_name: camerohealth-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: camerohealth/web:1.0.0
    container_name: camerohealth-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
