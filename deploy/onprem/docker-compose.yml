
# ─── CameroHealth On-Premise Stack ───────────────────────────────────────────
# Builds every image from source. Used for local validation, CI image builds,
# and any install where the hospital has network access to fetch base images.
# For an air-gapped install, docker-compose.prod.yml overrides `build:` with
# `image:` so `docker compose up` uses images already loaded via `docker load`
# from the offline bundle instead of building.
#
# Only nginx publishes ports to the host — postgres, minio and the api are
# reachable only from other containers on the internal network.

name: camerohealth

networks:
  internal:
    driver: bridge

volumes:
  camerohealth_postgres_data:
  camerohealth_minio_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-camerohealth}
      POSTGRES_USER: ${DB_USER:-camerohealth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      TZ: ${APP_TIMEZONE:-Africa/Douala}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - camerohealth_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Not published by default — set POSTGRES_PORT in .env and add a
    # `ports:` mapping locally only if you need direct DB access for debugging.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-camerohealth} -d ${DB_NAME:-camerohealth}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env}
    volumes:
      - camerohealth_minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: ensures the CameroHealth bucket exists before the API's own
  # startup check runs, and lets `docker compose up` report a clear failure
  # here instead of a confusing API crash loop if MinIO is misconfigured.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-camerohealth}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET
      "

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: camerohealth/api:${CAMEROHEALTH_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-camerohealth}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-camerohealth}
      DIRECT_URL: postgresql://${DB_USER:-camerohealth}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-camerohealth}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${APP_ORIGIN:-https://camerohealth.local}
      DEPLOYMENT_MODE: onprem
      DATA_RESIDENCY: LOCAL
      CLOUD_PATIENT_SYNC: "false"
      HOSPITAL_ID: ${HOSPITAL_ID:-}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-}
      CAMEROHEALTH_VERSION: ${CAMEROHEALTH_VERSION:-dev}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-camerohealth}
      MINIO_USE_SSL: "false"
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      # Optional integrations — absent means the feature is simply unavailable,
      # per the same optional-config pattern used everywhere else (see
      # backend/src/config.js). Never required for onprem to run.
      MTN_MOMO_SUBSCRIPTION_KEY: ${MTN_MOMO_SUBSCRIPTION_KEY:-}
      MTN_MOMO_API_USER: ${MTN_MOMO_API_USER:-}
      MTN_MOMO_API_KEY: ${MTN_MOMO_API_KEY:-}
    networks:
      - internal

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${APP_ORIGIN:-https://camerohealth.local}/api
        VUE_APP_GOOGLE_MAPS_API_KEY: ${VUE_APP_GOOGLE_MAPS_API_KEY:-unconfigured}
        CLIENT_ID: ${CLIENT_ID:-unconfigured}
    image: camerohealth/web:${CAMEROHEALTH_VERSION:-dev}
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - internal
