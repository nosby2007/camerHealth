# ─── CameroHealth On-Premise — reverse proxy ────────────────────────────────
# Mirrors the routing firebase.json does today: /api/** goes to the API,
# everything else goes to the static web bundle. This is the ONLY container
# in the stack that binds to a host port (see docker-compose.yml).

# Real client IP behind the proxy, for the API's rate limiter / audit log.
map $http_x_forwarded_for $client_real_ip {
    default $remote_addr;
}

server {
    listen 80;
    server_name _;

    # Uncomment once TLS certificates are placed in ./certs/ (see
    # docs/onprem/SECURITY.md) to force HTTPS. Left as HTTP-only by default
    # so a fresh install works immediately on a LAN without certs.
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;  # clinical photo/document uploads

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

