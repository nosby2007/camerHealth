# ─── CameroHealth On-Premise — reverse proxy ────────────────────────────────
# Mirrors the routing firebase.json does today: /api/** goes to the API,
# everything else goes to the static web bundle. This is the ONLY container
# in the stack that binds to a host port (see docker-compose.yml).

# Real client IP behind the proxy, for the API's rate limiter / audit log.
map $http_x_forwarded_for $client_real_ip {
    default $remote_addr;
}

# Docker's embedded DNS server. A static `proxy_pass http://web:80/` resolves
# the hostname ONCE when the nginx worker starts and then proxies straight to
# that cached IP forever — if the web/api container is later recreated
# (rebuild, restart, `docker compose up -d`), it gets a new IP and nginx keeps
# hammering the old one: "connect() failed (113: Host is unreachable)".
# Routing proxy_pass through a variable forces nginx to re-resolve via this
# resolver on every request instead of caching at startup.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # TLS certificates are in ./certs/ (see docs/onprem/SECURITY.md) and the
    # HTTPS server block below is live, so force HTTPS here. Required, not
    # just preferred: the web image's API_URL is baked in at build time as
    # https://..., so an http:// page load calls an https:// API — a
    # cross-origin request the backend has no CORS headers for, which the
    # browser blocks outright. Leave this commented out only for a fresh
    # install that has no certificates yet.
    return 301 https://$host$request_uri;

    client_max_body_size 25m;  # clinical photo/document uploads

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        # $request_uri is appended explicitly (rather than relying on nginx's
        # automatic location-prefix substitution) because that substitution
        # is skipped whenever proxy_pass's target contains a variable — with
        # just `http://$api_upstream:4000/api/` every request would reach the
        # API as bare `/api/`, silently dropping the rest of the path.
        set $api_upstream api;
        proxy_pass http://$api_upstream:4000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        set $web_upstream web;
        proxy_pass http://$web_upstream:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS (enable once certificates exist in ./certs/) ───────────────────────
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;  # clinical photo/document uploads

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        # $request_uri is appended explicitly (rather than relying on nginx's
        # automatic location-prefix substitution) because that substitution
        # is skipped whenever proxy_pass's target contains a variable — with
        # just `http://$api_upstream:4000/api/` every request would reach the
        # API as bare `/api/`, silently dropping the rest of the path.
        set $api_upstream api;
        proxy_pass http://$api_upstream:4000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        set $web_upstream web;
        proxy_pass http://$web_upstream:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
