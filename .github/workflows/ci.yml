name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint-test:
    name: Frontend — lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:nursing
      - run: npm run test:patient360

  backend-test:
    name: Backend — tests against a real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: camerohealth_ci
          POSTGRES_USER: camerohealth
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camerohealth -d camerohealth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://camerohealth:ci_only_password@localhost:5432/camerohealth_ci
      DIRECT_URL: postgresql://camerohealth:ci_only_password@localhost:5432/camerohealth_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply schema (prisma migrate deploy)
        run: npx prisma migrate deploy
      - run: npm run test:db
      # test:tenant is excluded here — it drives a running API server over
      # HTTP and expects pre-seeded staff/facilities to test isolation
      # between them, neither of which exist in this bare CI database. It
      # needs a real seed step + a live `npm start` alongside it before it
      # can run unattended; tracked as follow-up, not skipped silently.

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory only — does not block merges
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high

  docker-build:
    name: Docker build (no push — validates Dockerfiles on every PR/push)
    runs-on: ubuntu-latest
    needs: [frontend-lint-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: camerohealth/api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            API_URL=/api
          tags: camerohealth/web:ci
