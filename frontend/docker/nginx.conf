# Serves the static Nuxt SPA bundle. API calls go straight to the API
# container/service (baked into the client bundle as API_URL at build time,
# see Dockerfile) — this Nginx never proxies /api itself. The reverse-proxy
# Nginx in deploy/onprem/nginx/default.conf is the one that fronts both the
# web and API containers on ports 80/443 for the whole stack.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
